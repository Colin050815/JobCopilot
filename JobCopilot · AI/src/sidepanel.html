<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BOSS自动投递</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="header"><h1>BOSS 自动投递</h1></div>

  <!-- 配置 -->
  <section class="card">
    <div class="card-h" data-toggle="cfgBody"><span>① 配置</span><span class="chev">▾</span></div>
    <div class="card-b" id="cfgBody">
      <label>MuskAI API Key</label>
      <input type="password" id="muskApiKey" placeholder="在 MuskAI 控制台复制 API Key" autocomplete="off">

      <label>GPT-5.6 模型</label>
      <select id="gptModel">
        <option value="gpt-5.6-sol">GPT-5.6 Sol（能力优先）</option>
        <option value="gpt-5.6-terra" selected>GPT-5.6 Terra（默认均衡）</option>
        <option value="gpt-5.6-luna">GPT-5.6 Luna（速度优先）</option>
      </select>
      <div class="privacy-note">Key 仅保存在本机；AI 筛选会把简历文字和岗位信息发送至 MuskAI。</div>

      <label>简历文件（自动解析）</label>
      <input type="file" id="resumeFile" accept=".pdf,.docx,.txt,.md,image/jpeg,image/png,image/webp">
      <div class="resume-actions">
        <button type="button" class="btn-secondary btn-compact" id="btnParseResume">本地解析到文本框</button>
        <button type="button" class="btn-secondary btn-compact" id="btnGenerateResumeImages">生成投递图片</button>
        <button type="button" class="btn-warn btn-compact" id="btnOcrResume" hidden>使用 MuskAI OCR</button>
      </div>
      <div id="resumeParseStatus" class="parse-status">可在本机解析文字或生成投递图片；只有 OCR 会把扫描件发送 MuskAI。</div>

      <label>简历文字（必填，用于AI筛选 + 生成招呼语）</label>
      <textarea id="resumeText" rows="5" placeholder="粘贴你的简历：技能、项目经历、教育背景、实习经历等，越详细招呼语越精准"></textarea>

      <label>投递图片（可由上方文件生成，也可手动上传）</label>
      <input type="file" id="resumeImg" accept="image/*">
      <div id="imgPrev"></div>

      <label>岗位关键词</label>
      <input type="text" id="keyword" placeholder="如：数据分析 / AI应用">

      <label>城市（多个城市用 / 或逗号分隔）</label>
      <input type="text" id="city" placeholder="如：成都 / 重庆">

      <label>收集岗位总数（多城市平均分配）</label>
      <input type="number" id="count" value="20" min="1" max="200">

      <div class="cfg-actions">
        <button class="btn-primary" id="saveCfg">保存配置</button>
        <button class="btn-secondary" id="btnTestAI">测试 AI 连接</button>
      </div>
      <span id="saved" class="ok-msg" style="display:none">✓ 已保存</span>
    </div>
  </section>

  <!-- 运行 -->
  <section class="card">
    <div class="card-h"><span>② 运行</span></div>
    <div class="card-b">
      <button class="btn-go" id="btnCollect">开始收集 + AI筛选</button>
      <div class="run-note">运行时可切换到其他标签页，但请保持本侧边栏开启；关闭 Edge 或侧边栏会安全中断。</div>
      <div class="status-row">
        <span id="phaseText">未开始</span>
        <span id="progText"></span>
      </div>
      <div class="ctrl">
        <button id="btnPause" disabled>暂停</button>
        <button id="btnStop" disabled>停止</button>
        <button id="btnReset">重置</button>
      </div>
    </div>
  </section>

  <!-- 审核 -->
  <section class="card" id="reviewCard" style="display:none">
    <div class="card-h"><span>③ 审核确认</span><span id="reviewCount"></span></div>
    <div class="card-b">
      <div class="review-tools">
        <label class="mini"><input type="checkbox" id="selAll" checked> 全选匹配</label>
        <div class="review-actions">
          <button class="btn-stop" id="btnReviewStop" hidden>停止投递</button>
          <button class="btn-go" id="btnDeliver">投递选中</button>
        </div>
      </div>
      <div id="reviewList"></div>
    </div>
  </section>

  <!-- 手机端投递补充 -->
  <section class="card" id="mobileFollowupCard">
    <div class="card-h" data-toggle="mobileFollowupBody">
      <span>④ 手机投递补充</span><span>▾</span>
    </div>
    <div class="card-b" id="mobileFollowupBody">
      <div class="followup-range">
        <label>投递日期
          <input type="date" id="followupDate">
        </label>
        <label>开始时间
          <input type="time" id="followupStart">
        </label>
        <label>结束时间
          <input type="time" id="followupEnd">
        </label>
      </div>
      <div class="privacy-note">只扫描该时间段内预览以“[送达]您好，我是…”开头的会话。先读取 JD 并生成草稿，不会自动发送。</div>
      <button class="btn-secondary" id="btnBuildFollowups">扫描会话 + 生成草稿</button>
      <div id="followupStatus" class="parse-status">请填写手机端投递的准确时间范围。</div>
      <div id="followupReview" hidden>
        <div class="review-tools">
          <label class="mini"><input type="checkbox" id="selAllFollowups" checked> 全选可发送</label>
          <button class="btn-go" id="btnSendFollowups">确认发送选中</button>
        </div>
        <div id="followupDraftList"></div>
      </div>
    </div>
  </section>

  <!-- 日志 -->
  <section class="card">
    <div class="card-h"><span>日志</span><button class="mini-btn" id="clearLog">清空</button></div>
    <div class="log" id="log"></div>
  </section>

  <script src="../vendor/mammoth.browser.min.js"></script>
  <script src="resume-parser-core.js"></script>
  <script type="module" src="resume-parser-browser.mjs"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
